<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Glowing Text & Line Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Linear Gradient for Dynamic Pulse Chart -->
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="300" fill="url(#grid)" rx="12" />

  <!-- DYNAMIC BACKGROUND ANIMATED/GRAPHICAL ELEMENTS (Behind text foreground) -->
  <g opacity="0.6">
    <!-- Drift Signal Wave Area -->
    <path d="M 50 220 Q 200 180 350 230 T 650 190 T 950 240 T 1150 180 L 1150 270 L 50 270 Z" fill="url(#area-grad)" />

    <!-- Animated Scanning Laser Line -->
    <path d="M 50 220 Q 200 180 350 230 T 650 190 T 950 240 T 1150 180" fill="none" stroke="url(#chart-grad)" stroke-width="3" filter="url(#glow-cyan)">
      <animate attributeName="stroke-dasharray" values="0,1500;900,1500;1500,1500" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Pulse Data Nodes -->
    <circle cx="350" cy="230" r="5" fill="#58a6ff" filter="url(#glow-cyan)">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="190" r="6" fill="#bc8cff" filter="url(#glow-purple)">
      <animate attributeName="r" values="5;9;5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="240" r="5" fill="#39d353" filter="url(#glow-cyan)">
      <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Radar Sweep Orbit -->
    <circle cx="1050" cy="90" r="60" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="1050" cy="90" r="35" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.5" />
    <line x1="1050" y1="90" x2="1105" y2="65" stroke="#58a6ff" stroke-width="2" filter="url(#glow-cyan)">
      <animateTransform attributeName="transform" type="rotate" from="0 1050 90" to="360 1050 90" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- FOREGROUND TEXT & BRANDING (Ensured high contrast and foreground placement) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title Badge -->
    <rect x="360" y="42" width="480" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="600" y="63" font-size="13" font-weight="600" fill="#58a6ff" letter-spacing="2">
      PRODUCTION AI &amp; MLOPS OBSERVABILITY
    </text>

    <!-- Main Title -->
    <text x="600" y="125" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Model Monitoring <tspan fill="#bc8cff">📊</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" font-size="18" font-weight="400" fill="#8b949e">
      Curated List of SaaS Platforms &amp; Open-Source Projects for ML Observability, Drift Detection &amp; LLM Evaluation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(300, 200)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="90" y="21" font-size="13" fill="#79c0ff" font-weight="500">📈 Data Drift &amp; Quality</text>

      <!-- Pill 2 -->
      <rect x="200" y="0" width="200" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="300" y="21" font-size="13" fill="#d2a8ff" font-weight="500">🔍 LLM Tracing &amp; Eval</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="180" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="510" y="21" font-size="13" fill="#7ee787" font-weight="500">⚡ Production Alerts</text>
    </g>
  </g>
</svg>
